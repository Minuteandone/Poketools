name: Diagnose assembled Bulbasaur in historical viewer
on:
  push:
    paths:
      - '.github/workflows/diagnose-bulbasaur.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Analyze historical Bulbasaur's Nitro graphics and animation maps
        run: node sprite-history/diagnose-bulbasaur.mjs
