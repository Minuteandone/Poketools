name: Compare front back and gender Bulbasaur graphics
on:
  push:
    paths:
      - '.github/workflows/inspect-bulba-variants.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Compare every variant of June 2010 Bulbasaur sprites
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tick-server.log 2>&1 &
          sleep 2
          node sprite-history/inspect-bulba-variants.mjs
      - name: Save original reference and variant checks
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add sprite-history/debug/
          git diff --cached --quiet || (git commit -m "Inspect all gender and side variants of historical Bulbasaur" && git pull --rebase origin main && git push)
