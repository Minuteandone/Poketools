name: Package resource Time Machine exhibit source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-resource-exhibits.yml'
      - 'resource-time-machine/models.html'
      - 'resource-time-machine/battle-stages.html'
      - 'resource-time-machine/narc-lab.html'
      - 'resource-time-machine/viewers/*.js'
      - 'resource-time-machine/index.html'
      - 'resource-time-machine/EXHIBITS.md'
      - 'resource-time-machine/specialists-smoke.mjs'
      - 'resource-time-machine/items.html'
      - 'resource-time-machine/dialogue.html'
      - 'resource-time-machine/events.html'
      - 'resource-time-machine/seasons.html'
      - 'resource-time-machine/wallpapers.html'
      - 'resource-time-machine/party-icons.html'
      - 'resource-time-machine/monolith.html'
      - 'resource-time-machine/viewers/collections.css'
      - 'resource-time-machine/collections-smoke.mjs'
      - 'resource-time-machine/footprints.html'
      - 'resource-time-machine/manuals.html'
      - 'resource-time-machine/retro-smoke.mjs'
      - 'resource-time-machine/narc-indexes.json'
      - 'resource-time-machine/build_narc_names.py'
      - 'resource-time-machine/exhibits-smoke.mjs'
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assemble source ZIP
        run: |
          mkdir -p resource-time-machine/downloads
          zip -q -9 resource-time-machine/downloads/exhibit-source.zip \
            resource-time-machine/EXHIBITS.md \
            resource-time-machine/narc-indexes.json \
            resource-time-machine/resources.json \
            resource-time-machine/film-history.json \
            src/nitro.js \
            src/narc.js \
            src/lz.js \
            src/binary.js \
            resource-time-machine/build_narc_names.py \
            resource-time-machine/index.html \
            resource-time-machine/files.html \
            resource-time-machine/models.html \
            resource-time-machine/battle-stages.html \
            resource-time-machine/narc-lab.html \
            resource-time-machine/films.html \
            resource-time-machine/specialists-smoke.mjs \
            resource-time-machine/items.html \
            resource-time-machine/dialogue.html \
            resource-time-machine/events.html \
            resource-time-machine/seasons.html \
            resource-time-machine/wallpapers.html \
            resource-time-machine/party-icons.html \
            resource-time-machine/monolith.html \
            resource-time-machine/collections-smoke.mjs \
            resource-time-machine/viewers/collections.css \
            resource-time-machine/footprints.html \
            resource-time-machine/manuals.html \
            resource-time-machine/retro-smoke.mjs \
            resource-time-machine/viewers/source-tiles.js \
            resource-time-machine/viewers/imd-model.js \
            resource-time-machine/viewers/shared.js \
            resource-time-machine/exhibits-smoke.mjs \
            .github/workflows/time-machine-specialists.yml \
            .github/workflows/resource-exhibits-browser.yml
          unzip -t resource-time-machine/downloads/exhibit-source.zip
      - name: Save source package
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add resource-time-machine/downloads/exhibit-source.zip
          git diff --cached --quiet || (git commit -m "Package reusable source for specialized Time Machine exhibits" && git pull --rebase origin main && git push)
