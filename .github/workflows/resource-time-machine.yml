name: Build resource Time Machine catalog
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resource-time-machine.yml'
      - 'resource-time-machine/build_index.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate resource explorer module syntax
        run: |
          python3 - <<'PY'
          import pathlib,re
          html=pathlib.Path('resource-time-machine/index.html').read_text()
          script=re.search(r'<script type="module">([\s\S]+?)</script>',html)
          assert script
          pathlib.Path('/tmp/resource-time-machine.mjs').write_text(script.group(1))
          PY
          node --check /tmp/resource-time-machine.mjs
      - name: Index all real resource files and selected histories
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -u resource-time-machine/build_index.py
      - name: Verify source directory coverage
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('resource-time-machine/resources.json'))
          assert x['resourceFiles']>20000
          assert len(x['topLevelFolders'])>=150
          assert len(x['histories'])>=30
          assert 'resource/fldmapdata/eventdata/data/c01.mev' in x['histories']
          print('Indexed',x['resourceFiles'],'actual resource files across',len(x['topLevelFolders']),'top-level folders and',len(x['histories']),'histories')
          PY
      - name: Save generated public metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resource-time-machine/resources.json
          git diff --cached --quiet || (git commit -m "Index historical Pokémon Black White resource files" && git pull --rebase origin main && git push)
